name: Electron footprint analysis

on:
  push:
    branches:
      - codex/electron-size-pass-20260820
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-footprint:
    name: Linux runtime footprint
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - name: Install toolchain and Electron
        shell: bash
        run: |
          npm ci
          env -u ELECTRON_SKIP_BINARY_DOWNLOAD npm rebuild electron
      - name: Build unpacked Electron application
        shell: bash
        run: |
          mkdir -p native-bin
          npm run pack:linux:ci
      - name: Report Linux runtime files
        shell: bash
        run: |
          echo '--- Linux files, largest first ---'
          find release/linux-unpacked -type f -printf '%s\t%P\n' | sort -nr
          echo '--- Linux directory totals ---'
          du -sb release/linux-unpacked release/linux-unpacked/resources release/linux-unpacked/locales
      - name: Exercise candidate lean runtimes
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$PWD/release/linux-unpacked"
          executable=$(find "$source_dir" -maxdepth 1 -type f -perm -111 ! -name 'chrome-sandbox' ! -name 'chrome_crashpad_handler' | head -n 1)
          test -n "$executable"

          launch_variant() {
            local target_executable="$1"
            local name="$2"
            shift 2
            xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' bash -c '
              set -e
              app="$1"
              user_data="$2"
              shift 2
              "$app" --no-sandbox --user-data-dir="$user_data" "$@" >"$user_data.log" 2>&1 &
              pid=$!
              sleep 7
              kill -0 "$pid"
              kill "$pid" || true
              wait "$pid" || true
            ' _ "$target_executable" "$RUNNER_TEMP/user-$name" "$@"
          }

          test_variant() {
            local name="$1"
            shift
            local target="$RUNNER_TEMP/apollo-$name"
            rm -rf "$target"
            cp -a "$source_dir" "$target"
            for relative_path in "$@"; do
              rm -f "$target/$relative_path"
            done
            local before after
            before=$(du -sb "$source_dir" | cut -f1)
            after=$(du -sb "$target" | cut -f1)
            printf '%s: %s bytes removed\n' "$name" "$((before - after))"
            local target_executable="$target/$(basename "$executable")"
            launch_variant "$target_executable" "$name-normal" \
              --disable-features=Vulkan,WebGPU,WebGPUService
            launch_variant "$target_executable" "$name-software" \
              --disable-features=Vulkan,WebGPU,WebGPUService \
              --disable-gpu
          }

          test_variant hardware-only \
            libvk_swiftshader.so \
            vk_swiftshader_icd.json \
            libvulkan.so.1

          test_variant hardware-no-crashpad \
            libvk_swiftshader.so \
            vk_swiftshader_icd.json \
            libvulkan.so.1 \
            chrome_crashpad_handler

  windows-footprint:
    name: Windows runtime footprint
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - name: Install toolchain and Electron
        shell: pwsh
        run: |
          npm ci
          Remove-Item Env:ELECTRON_SKIP_BINARY_DOWNLOAD -ErrorAction SilentlyContinue
          npm rebuild electron
      - name: Build unpacked Electron application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native-bin | Out-Null
          npm run build:app
          npx electron-builder --dir --win --publish never
      - name: Report Windows runtime files
        shell: pwsh
        run: |
          '--- Windows files, largest first ---'
          Get-ChildItem release/win-unpacked -Recurse -File |
            Sort-Object Length -Descending |
            ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath((Resolve-Path 'release/win-unpacked'), $_.FullName)
              '{0}`t{1}' -f $_.Length, $relative
            }
          $total = (Get-ChildItem release/win-unpacked -Recurse -File | Measure-Object Length -Sum).Sum
          "Windows unpacked total: $total bytes"
      - name: Exercise candidate lean Windows runtimes
        shell: pwsh
        run: |
          $source = (Resolve-Path 'release/win-unpacked').Path
          $baseline = (Get-ChildItem $source -Recurse -File | Measure-Object Length -Sum).Sum
          $groups = [ordered]@{
            'hardware-only' = @(
              'vk_swiftshader.dll',
              'vk_swiftshader_icd.json',
              'vulkan-1.dll'
            )
            'no-webgpu-vulkan' = @(
              'dxcompiler.dll',
              'dxil.dll',
              'vk_swiftshader.dll',
              'vk_swiftshader_icd.json',
              'vulkan-1.dll'
            )
          }

          function Test-Launch([string]$Target, [string]$Name, [string[]]$ExtraArguments) {
            $exe = Join-Path $Target 'Apollo Client.exe'
            $userData = Join-Path $env:RUNNER_TEMP "user-$Name"
            $stdout = Join-Path $env:RUNNER_TEMP "$Name.stdout.log"
            $stderr = Join-Path $env:RUNNER_TEMP "$Name.stderr.log"
            Remove-Item $userData -Recurse -Force -ErrorAction SilentlyContinue
            $arguments = @(
              "--user-data-dir=$userData",
              '--disable-features=Vulkan,WebGPU,WebGPUService'
            ) + $ExtraArguments
            $process = Start-Process $exe \
              -ArgumentList $arguments \
              -RedirectStandardOutput $stdout \
              -RedirectStandardError $stderr \
              -PassThru
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw "$Name exited before the packaged runtime smoke window completed."
            }
            Stop-Process -Id $process.Id -Force
            Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
          }

          foreach ($entry in $groups.GetEnumerator()) {
            $target = Join-Path $env:RUNNER_TEMP "apollo-$($entry.Key)"
            Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue
            Copy-Item $source $target -Recurse
            foreach ($relative in $entry.Value) {
              Remove-Item (Join-Path $target $relative) -Force -ErrorAction SilentlyContinue
            }
            $after = (Get-ChildItem $target -Recurse -File | Measure-Object Length -Sum).Sum
            "$($entry.Key): $($baseline - $after) bytes removed"
            Test-Launch $target "$($entry.Key)-normal" @()
            Test-Launch $target "$($entry.Key)-software" @('--disable-gpu')
          }
