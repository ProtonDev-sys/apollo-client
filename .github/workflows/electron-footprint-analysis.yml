name: Apply Electron footprint settings

on:
  push:
    branches:
      - codex/electron-size-pass-20260820

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: codex/electron-size-pass-20260820
          fetch-depth: 0
      - name: Configure unused Chromium features
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("main.js")
          source = path.read_text(encoding="utf-8")
          marker = '''const TRUSTED_RENDERER_ENTRY_URL = pathToFileURL(TRUSTED_RENDERER_ENTRY_PATH).toString();
          '''
          addition = '''const TRUSTED_RENDERER_ENTRY_URL = pathToFileURL(TRUSTED_RENDERER_ENTRY_PATH).toString();
          const DISABLED_CHROMIUM_FEATURES = Object.freeze([
            "Vulkan",
            "WebGPU",
            "WebGPUService"
          ]);

          function configureLeanChromiumRuntime(commandLine = app.commandLine) {
            const existingFeatures = typeof commandLine?.getSwitchValue === "function"
              ? String(commandLine.getSwitchValue("disable-features") || "")
              : "";
            const disabledFeatures = new Set(
              existingFeatures
                .split(",")
                .map((feature) => feature.trim())
                .filter(Boolean)
            );
            DISABLED_CHROMIUM_FEATURES.forEach((feature) => disabledFeatures.add(feature));

            if (typeof commandLine?.removeSwitch === "function") {
              commandLine.removeSwitch("disable-features");
            }
            commandLine?.appendSwitch?.(
              "disable-features",
              [...disabledFeatures].join(",")
            );

            return [...disabledFeatures];
          }

          configureLeanChromiumRuntime();
          '''

          if "function configureLeanChromiumRuntime(" not in source:
              if source.count(marker) != 1:
                  raise SystemExit("Unable to locate the Electron runtime configuration insertion point.")
              source = source.replace(marker, addition, 1)
              path.write_text(source, encoding="utf-8")
          PY
      - name: Validate the main-process update
        shell: bash
        run: |
          node --check main.js
          git diff --check
      - name: Commit measured runtime settings
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          git commit -m "Disable unused Chromium graphics features"
          git push origin HEAD:codex/electron-size-pass-20260820
