name: Refresh audited lockfile

on:
  push:
    branches:
      - codex/ui-foundation-20260820

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/ui-foundation-20260820
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Refresh patched production resolutions
        run: npm audit fix --package-lock-only
      - name: Verify production dependency audit
        run: npm audit --omit=dev
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already contains the audited resolutions."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh audited dependency lockfile"
          git push origin HEAD:codex/ui-foundation-20260820
