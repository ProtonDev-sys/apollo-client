name: Toolchain audit report

on:
  push:
    branches:
      - codex/toolchain-audit-20260820

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/toolchain-audit-20260820
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install complete dependency tree
        run: npm ci
      - name: Capture complete audit report
        shell: bash
        run: npm audit --json > toolchain-audit.json || true
      - name: Commit audit report
        shell: bash
        run: |
          if git diff --quiet -- toolchain-audit.json && git ls-files --error-unmatch toolchain-audit.json >/dev/null 2>&1; then
            echo "Audit report is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toolchain-audit.json
          git commit -m "Capture complete toolchain audit"
          git push origin HEAD:codex/toolchain-audit-20260820
