name: Upgrade audited toolchain

on:
  push:
    branches:
      - codex/toolchain-audit-20260820

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/toolchain-audit-20260820
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Upgrade direct Electron toolchain dependencies
        run: npm install --save-dev --package-lock-only electron@43.4.1 electron-builder@latest
      - name: Refresh patched transitive dependencies
        run: npm audit fix --package-lock-only
      - name: Verify complete dependency audit
        run: npm audit
      - name: Commit audited dependency tree
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency tree already contains the audited resolutions."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade the Electron build toolchain"
          git push origin HEAD:codex/toolchain-audit-20260820
