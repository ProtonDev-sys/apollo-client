name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  apply-resource-pass:
    name: Apply validated Electron resource controls
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/electron-resource-budget-20260820'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/electron-resource-budget-20260820
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Apply runtime and renderer controls
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path("main.js")
          main_source = main_path.read_text(encoding="utf-8")
          main_source = main_source.replace("${message}\\n`);", "${message}\n`);", 1)
          main_path.write_text(main_source, encoding="utf-8")

          renderer_path = Path("src/renderer.js")
          renderer_source = renderer_path.read_text(encoding="utf-8")
          old = "\n  navigationBackStack.push(structuredClone(currentNavigationSnapshot));"
          new = "\n    navigationBackStack.push(structuredClone(currentNavigationSnapshot));"
          if renderer_source.count(old) != 1:
              raise SystemExit("forward navigation indentation marker was not unique")
          renderer_path.write_text(renderer_source.replace(old, new, 1), encoding="utf-8")
          PY
          python3 scripts/apply-electron-resource-pass.py
          git rm src/desktop/listen-along-signaling.js src/desktop/runtime-assets.js
      - name: Regenerate compact dependency lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate resource controls
        run: |
          npm run check:runtime
          npm run check:resources
          npm run check:syntax
          npm test
          npm run audit:deps
          git diff --check
      - name: Commit validated permanent files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp scripts/permanent-resource-ci.yml .github/workflows/ci.yml
          git rm \
            .github/workflows/apply-electron-resource-pass.yml \
            scripts/apply-electron-resource-pass.py \
            scripts/permanent-resource-ci.yml
          git add -A
          git commit -m "Reduce Electron startup, memory, CPU, and package size"
          git push origin HEAD:codex/electron-resource-budget-20260820

  verify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify Electron runtime boundary
        run: npm run check:runtime
      - name: Verify Electron resource budgets
        run: npm run check:resources
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Run tests
        run: npm test
      - name: Audit production dependencies
        run: npm run audit:deps

  ui-smoke:
    name: Electron UI smoke
    runs-on: ubuntu-latest
    env:
      ELECTRON_DISABLE_SECURITY_WARNINGS: "true"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies with Electron
        run: npm ci
      - name: Render and exercise the client UI
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" npm run test:ui
      - name: Upload rendered UI
        uses: actions/upload-artifact@v4
        with:
          name: apollo-client-ui-smoke
          path: test-results/apollo-client-ui.png
          if-no-files-found: error
          retention-days: 7

  toolchain:
    name: Electron audit and package smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install complete dependency tree
        run: npm ci
      - name: Audit complete dependency tree
        run: npm run audit:all
      - name: Prepare optional native resource directory
        run: mkdir -p native-bin
      - name: Build unpacked Linux application
        run: npm run pack:linux:ci
      - name: Verify packaged application structure and size
        shell: bash
        run: |
          test -d release/linux-unpacked
          test -f release/linux-unpacked/resources/app.asar
          test -s release/linux-unpacked/resources/app.asar
          npm run check:package
