name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install development toolchain
        run: npm ci
      - name: Verify Electron runtime, budgets, syntax, tests, and generated bundle
        run: npm run verify
      - name: Audit the complete dependency tree
        run: npm run audit:all

  ui-smoke:
    name: Native Electron UI smoke
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      ELECTRON_DISABLE_SECURITY_WARNINGS: "true"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - name: Install development toolchain
        run: npm ci
      - name: Install the Electron binary
        run: env -u ELECTRON_SKIP_BINARY_DOWNLOAD npm rebuild electron
      - name: Exercise the desktop interface
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" npm run test:ui
      - name: Upload rendered interface
        uses: actions/upload-artifact@v7
        with:
          name: apollo-client-ui-smoke
          path: test-results/apollo-client-ui.png
          if-no-files-found: error
          retention-days: 7

  linux-package:
    name: Compact Linux package
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - name: Install development toolchain
        run: npm ci
      - name: Install the Electron binary
        run: env -u ELECTRON_SKIP_BINARY_DOWNLOAD npm rebuild electron
      - name: Build and validate the pruned application
        shell: bash
        run: |
          mkdir -p native-bin
          npm run pack:linux:ci
          npm run check:package
      - name: Exercise packaged hardware and software rendering
        shell: bash
        run: |
          set -euo pipefail
          executable=$(find release/linux-unpacked -maxdepth 1 -type f -perm -111 ! -name 'chrome-sandbox' ! -name 'chrome_crashpad_handler' | head -n 1)
          test -n "$executable"

          launch_packaged() {
            local mode="$1"
            shift
            local user_data="$RUNNER_TEMP/apollo-packaged-$mode"
            xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' bash -c '
              set -e
              app="$1"
              user_data="$2"
              shift 2
              "$app" --no-sandbox --user-data-dir="$user_data" "$@" >"$user_data.log" 2>&1 &
              pid=$!
              sleep 8
              kill -0 "$pid"
              kill "$pid" || true
              wait "$pid" || true
            ' _ "$executable" "$user_data" "$@"
          }

          launch_packaged hardware
          launch_packaged software --disable-gpu
      - name: Report package sizes
        shell: bash
        run: |
          asar_bytes=$(stat -c%s release/linux-unpacked/resources/app.asar)
          unpacked_bytes=$(du -sb release/linux-unpacked | cut -f1)
          printf 'app.asar: %s bytes\nLinux unpacked directory: %s bytes\n' "$asar_bytes" "$unpacked_bytes"
          {
            echo '### Linux package size'
            echo
            echo "- app.asar: ${asar_bytes} bytes"
            echo "- unpacked directory: ${unpacked_bytes} bytes"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload compact ASAR
        uses: actions/upload-artifact@v7
        with:
          name: apollo-client-linux-asar
          path: release/linux-unpacked/resources/app.asar
          if-no-files-found: error
          retention-days: 7

  windows-package:
    name: Compact Windows distributions
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - name: Install development toolchain
        run: npm ci
      - name: Install the Electron binary
        shell: pwsh
        run: |
          Remove-Item Env:ELECTRON_SKIP_BINARY_DOWNLOAD -ErrorAction SilentlyContinue
          npm rebuild electron
      - name: Build the pruned English-only installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native-bin | Out-Null
          npm run build:app
          npx electron-builder --win nsis --publish never
          npm run check:package
      - name: Exercise packaged hardware and software rendering
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'release/win-unpacked/Apollo Client.exe').Path

          function Test-PackagedLaunch([string]$Mode, [string[]]$ExtraArguments) {
            $userData = Join-Path $env:RUNNER_TEMP "apollo-packaged-$Mode"
            $arguments = @("--user-data-dir=$userData") + $ExtraArguments
            $process = Start-Process $exe -ArgumentList $arguments -PassThru
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              throw "The pruned Windows application exited during $Mode rendering smoke testing."
            }
            & taskkill.exe /PID $process.Id /T /F | Out-Null
          }

          Test-PackagedLaunch 'hardware' @()
          Test-PackagedLaunch 'software' @('--disable-gpu')
      - name: Create and exercise the portable archive
        shell: pwsh
        run: |
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $releaseDirectory = (Resolve-Path release).Path
          $archive = Join-Path $releaseDirectory "Apollo-Client-Portable-$version.7z"

          Push-Location release/win-unpacked
          try {
            & $sevenZip a -t7z -mx=9 -m0=lzma2 -ms=on $archive '.\*'
            if ($LASTEXITCODE -ne 0) {
              throw "7-Zip exited with code $LASTEXITCODE."
            }
          } finally {
            Pop-Location
          }

          $extractDirectory = Join-Path $env:RUNNER_TEMP 'apollo-portable-extracted'
          Remove-Item $extractDirectory -Recurse -Force -ErrorAction SilentlyContinue
          & $sevenZip x $archive "-o$extractDirectory" -y
          if ($LASTEXITCODE -ne 0) {
            throw "Portable archive extraction exited with code $LASTEXITCODE."
          }

          $portableExe = Join-Path $extractDirectory 'Apollo Client.exe'
          if (-not (Test-Path $portableExe)) {
            throw 'Portable archive does not contain the Electron executable.'
          }
          $process = Start-Process $portableExe -ArgumentList @(
            '--disable-gpu',
            "--user-data-dir=$(Join-Path $env:RUNNER_TEMP 'apollo-portable-user')"
          ) -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw 'The extracted portable application exited during smoke testing.'
          }
          & taskkill.exe /PID $process.Id /T /F | Out-Null
      - name: Enforce and report Windows sizes
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter 'Apollo-Client-Setup-*.exe' | Select-Object -First 1
          $portable = Get-ChildItem release -Filter 'Apollo-Client-Portable-*.7z' | Select-Object -First 1
          if (-not $installer) {
            throw 'Windows installer was not generated.'
          }
          if (-not $portable) {
            throw 'Windows portable archive was not generated.'
          }

          $maxInstallerBytes = 96000000
          $maxPortableBytes = 96000000
          if ($installer.Length -gt $maxInstallerBytes) {
            throw "Windows installer exceeds the $maxInstallerBytes-byte budget: $($installer.Length) bytes."
          }
          if ($portable.Length -gt $maxPortableBytes) {
            throw "Windows portable archive exceeds the $maxPortableBytes-byte budget: $($portable.Length) bytes."
          }

          $unpackedBytes = (Get-ChildItem release/win-unpacked -Recurse -File | Measure-Object Length -Sum).Sum
          "Windows installer: $($installer.Length) bytes"
          "Windows portable archive: $($portable.Length) bytes"
          "Windows unpacked runtime: $unpackedBytes bytes"
          @(
            '### Windows package size',
            '',
            "- installer: $($installer.Length) bytes",
            "- portable 7-Zip archive: $($portable.Length) bytes",
            "- unpacked runtime: $unpackedBytes bytes",
            "- installer budget: $maxInstallerBytes bytes",
            "- portable budget: $maxPortableBytes bytes"
          ) | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: apollo-client-windows-installer
          path: release/Apollo-Client-Setup-*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows portable archive
        uses: actions/upload-artifact@v7
        with:
          name: apollo-client-windows-portable
          path: release/Apollo-Client-Portable-*.7z
          if-no-files-found: error
          retention-days: 7
