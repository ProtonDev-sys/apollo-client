name: Apply precise renderer foundation refactor

on:
  push:
    branches:
      - codex/renderer-foundation-20260820

concurrency:
  group: renderer-foundation-refactor-v2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/renderer-foundation-20260820
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Rewrite renderer boundaries
        run: python3 scripts/refactor-renderer-foundation.py
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate renderer refactor
        run: |
          npm run check:syntax
          npm test
          npm run audit:deps
      - name: Commit validated refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/refactor-renderer.yml \
            .github/workflows/refactor-renderer-v2.yml \
            scripts/refactor-renderer-foundation.py
          git add src/renderer.js
          git commit -m "Extract renderer track modeling and repair fallback polling"
          git push origin HEAD:codex/renderer-foundation-20260820
