name: Apply renderer search optimization

on:
  push:
    branches:
      - codex/electron-search-20260820

concurrency:
  group: renderer-search-optimization
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/electron-search-20260820
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Apply indexed search integration
        run: python3 scripts/apply-search-optimization.py
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate optimized renderer
        run: |
          npm run check:platform
          npm run check:syntax
          npm test
          npm run audit:deps
      - name: Commit validated renderer integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/apply-search-optimization.yml \
            scripts/apply-search-optimization.py
          git add src/renderer.js
          git commit -m "Integrate indexed and bounded song search"
          git push origin HEAD:codex/electron-search-20260820
