name: Apply reviewed search fixes

on:
  push:
    branches:
      - codex/search-followup-20260820

permissions:
  contents: write

jobs:
  apply:
    name: Apply and validate reviewed search fixes
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/search-followup-20260820
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Apply review fixes
        run: python3 scripts/apply-search-review-fixes.py
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate reviewed fixes
        run: |
          npm run check:runtime
          npm run check:syntax
          npm test
          npm run audit:deps
          git diff --check
      - name: Commit validated application files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer.js src/renderer/search-index.js
          if git diff --cached --quiet; then
            echo "No reviewed search fixes remain to commit."
            exit 0
          fi
          git commit -m "Fix collection filtering and bound search indexes"
          git fetch origin codex/search-followup-20260820
          git rebase origin/codex/search-followup-20260820
          git push origin HEAD:codex/search-followup-20260820
