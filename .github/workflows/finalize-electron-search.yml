name: Finalize Electron search optimization

on:
  push:
    branches:
      - codex/electron-search-20260820

concurrency:
  group: renderer-search-optimization
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/electron-search-20260820
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Narrow the platform guard to executable surfaces
        shell: bash
        run: |
          cat > scripts/check-electron-platform.js <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");

          const PROJECT_ROOT = path.resolve(__dirname, "..");
          const FORBIDDEN_ROOT_PATHS = [
            "src-tauri",
            "tauri.conf.json",
            "tauri.conf.json5",
            "tauri.conf.toml"
          ];
          const RUNTIME_DIRECTORIES = ["src"];
          const RUNTIME_ROOT_FILES = [
            "main.js",
            "preload.js",
            "discord-presence.js",
            "discord-social-bridge.js"
          ];
          const TAURI_REFERENCE_PATTERN = /@tauri-apps\/|\btauri::|\b__TAURI__\b|\btauri\.conf(?:\.json5?|\.toml)?\b/i;

          function walkFiles(directoryPath) {
            if (!fs.existsSync(directoryPath)) {
              return [];
            }

            return fs.readdirSync(directoryPath, { withFileTypes: true })
              .flatMap((entry) => {
                const resolvedPath = path.join(directoryPath, entry.name);
                if (entry.isDirectory()) {
                  return walkFiles(resolvedPath);
                }
                return entry.isFile() ? [resolvedPath] : [];
              });
          }

          function readPackageJson(projectRoot = PROJECT_ROOT) {
            return JSON.parse(fs.readFileSync(path.join(projectRoot, "package.json"), "utf8"));
          }

          function validateElectronPackage(packageJson) {
            const errors = [];
            const dependencies = {
              ...(packageJson.dependencies || {}),
              ...(packageJson.devDependencies || {}),
              ...(packageJson.optionalDependencies || {})
            };

            if (packageJson.main !== "main.js") {
              errors.push('package.json "main" must remain "main.js" for Electron.');
            }

            if (!String(packageJson.scripts?.start || "").includes("electron")) {
              errors.push("The start script must launch Electron.");
            }

            if (!dependencies.electron) {
              errors.push("Electron must remain an explicit dependency.");
            }

            if (!dependencies["electron-builder"]) {
              errors.push("electron-builder must remain an explicit packaging dependency.");
            }

            const tauriDependencies = Object.keys(dependencies)
              .filter((dependencyName) => dependencyName.startsWith("@tauri-apps/"));
            if (tauriDependencies.length) {
              errors.push(`Tauri dependencies are not permitted: ${tauriDependencies.join(", ")}.`);
            }

            return errors;
          }

          function validateRuntimeFile(projectRoot, filePath, errors) {
            if (!fs.existsSync(filePath) || !fs.statSync(filePath).isFile()) {
              return;
            }

            const relativePath = path.relative(projectRoot, filePath).replaceAll(path.sep, "/");
            const extension = path.extname(filePath).toLowerCase();
            if (![".js", ".mjs", ".cjs", ".json", ".html", ".css", ".toml", ".rs"].includes(extension)) {
              return;
            }

            const content = fs.readFileSync(filePath, "utf8");
            if (TAURI_REFERENCE_PATTERN.test(content)) {
              errors.push(`Tauri runtime reference is not permitted in ${relativePath}.`);
            }
          }

          function validateElectronBoundary(projectRoot = PROJECT_ROOT) {
            const errors = validateElectronPackage(readPackageJson(projectRoot));

            FORBIDDEN_ROOT_PATHS.forEach((relativePath) => {
              if (fs.existsSync(path.join(projectRoot, relativePath))) {
                errors.push(`Tauri project artifact is not permitted: ${relativePath}.`);
              }
            });

            RUNTIME_DIRECTORIES.forEach((relativeDirectory) => {
              walkFiles(path.join(projectRoot, relativeDirectory)).forEach((filePath) => {
                validateRuntimeFile(projectRoot, filePath, errors);
              });
            });
            RUNTIME_ROOT_FILES.forEach((relativePath) => {
              validateRuntimeFile(projectRoot, path.join(projectRoot, relativePath), errors);
            });

            return errors;
          }

          function run() {
            const errors = validateElectronBoundary();
            if (errors.length) {
              errors.forEach((error) => process.stderr.write(`error ${error}\n`));
              process.exitCode = 1;
              return;
            }

            process.stdout.write("Electron platform boundary verified.\n");
          }

          if (require.main === module) {
            run();
          }

          module.exports = {
            FORBIDDEN_ROOT_PATHS,
            RUNTIME_DIRECTORIES,
            RUNTIME_ROOT_FILES,
            TAURI_REFERENCE_PATTERN,
            readPackageJson,
            validateElectronBoundary,
            validateElectronPackage,
            validateRuntimeFile,
            walkFiles
          };
          EOF
      - name: Apply indexed search integration when pending
        shell: bash
        run: |
          if grep -q 'renderer/search-engine.js' src/renderer.js; then
            echo "Indexed search is already integrated."
          else
            python3 scripts/apply-search-optimization.py
          fi
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate finalized implementation
        run: |
          npm run check:platform
          npm run check:syntax
          npm test
          npm run audit:deps
      - name: Commit permanent implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch \
            .github/workflows/apply-search-optimization.yml \
            .github/workflows/finalize-electron-search.yml \
            scripts/apply-search-optimization.py
          git add scripts/check-electron-platform.js src/renderer.js
          if git diff --cached --quiet; then
            echo "Permanent implementation is already committed."
            exit 0
          fi
          git commit -m "Integrate indexed Electron song search"
          git push origin HEAD:codex/electron-search-20260820
