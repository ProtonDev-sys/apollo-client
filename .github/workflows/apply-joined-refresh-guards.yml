name: Apply joined-session generation guards

on:
  push:
    branches:
      - codex/renderer-foundation-20260820

concurrency:
  group: joined-session-generation-guards
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/renderer-foundation-20260820
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Apply joined-session lifecycle guards
        run: python3 scripts/apply-joined-refresh-guards.py
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate guarded lifecycle
        run: |
          npm run check:syntax
          npm test
          npm run audit:deps
      - name: Commit validated renderer update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/apply-joined-refresh-guards.yml \
            scripts/apply-joined-refresh-guards.py
          git add src/renderer.js
          git commit -m "Guard joined-session refreshes across lifecycle changes"
          git push origin HEAD:codex/renderer-foundation-20260820
